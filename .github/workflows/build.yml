name: Build Electron Apps

on:
  push:
    branches:
      - main
      - master

jobs:
  release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # <-- IMPORTANT: If Linux fails, Windows & Mac will still finish!
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Create .env file for the build
        run: echo "MANUFACTURER_NAME=${{ vars.MANUFACTURER_NAME }}" > .env
        shell: bash

      - name: Build Application
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          # Fallback value using Repository Variables if Secret is empty
          MANUFACTURER_NAME: ${{ secrets.MANUFACTURER_NAME || vars.MANUFACTURER_NAME }}
        run: |
          # 1. Inject the manufacturer string directly into the source file before packing
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Using PowerShell syntax or a node inline script for safe Cross-Platform file replacement
            node -e "const fs = require('fs'); let c = fs.readFileSync('main.js', 'utf8'); c = c.replace(/process\.env\.MANUFACTURER_NAME \|\| 'Компанія відсутня'/g, \"'\" + process.env.MANUFACTURER_NAME + \"'\"); fs.writeFileSync('main.js', c);"
          else
            # Linux and Mac runners can handle inline node code uniformly
            node -e "const fs = require('fs'); let c = fs.readFileSync('main.js', 'utf8'); c = c.replace(/process\.env\.MANUFACTURER_NAME \|\| 'Компанія відсутня'/g, \"'\" + process.env.MANUFACTURER_NAME + \"'\"); fs.writeFileSync('main.js', c);"
          fi

          # 2. Run standard compilers
          if [ "$RUNNER_OS" == "Windows" ]; then
            npm run build:win -- --publish never
          elif [ "$RUNNER_OS" == "Linux" ]; then
            ELECTRON_DISABLE_SECURITY_WARNINGS=true npm run build:linux -- --publish never
          elif [ "$RUNNER_OS" == "macOS" ]; then
            npm run build:mac -- --publish never
          fi
        shell: bash
        
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          # --- ADDED: Injecting the manufacturer name from GitHub Secrets ---
          MANUFACTURER_NAME: ${{ secrets.MANUFACTURER_NAME }}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            npm run build:win -- --publish never
          elif [ "$RUNNER_OS" == "Linux" ]; then
            ELECTRON_DISABLE_SECURITY_WARNINGS=true npm run build:linux -- --publish never
          elif [ "$RUNNER_OS" == "macOS" ]; then
            npm run build:mac -- --publish never
          fi
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Electron-Build-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
